<!DOCTYPE html>
<!-- lang="en" = the app default (i18n fallback); i18n.ts keeps it in sync
     with the user's stored language choice on languageChanged. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- Static value = the paper ground (light is the default); lib/theme.ts
         rewrites it from the canvas token on a theme change. -->
    <meta name="theme-color" content="#15120F" />
    <!-- English-first: this description is English, like the tags below and the
         app's lang="en" default. The German wording of the same pitch lives in
         app/src/locales/de.json (welcome.heroSub). Pinned by
         tests/test_index_html_description.py. -->
    <meta name="description" content="Ephe — Ephemeral SI Agent. Give it a task; it researches, builds and delivers while you watch. Runs locally on the engine you choose." />

    <!-- Social preview / Open Graph + Twitter. The card is app/public/og-image.png
         (1200x630, generated by scripts/generate_social_preview.py; the tracked source
         asset is docs/media/ephe-social-preview-1200x630.png). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ephe" />
    <meta property="og:title" content="Ephe — Ephemeral SI Agent" />
    <meta property="og:description" content="Give Ephe a task — it researches, builds and delivers. You watch live. Runs locally on the engine you choose." />
    <meta property="og:url" content="https://app.ephe.app/" />
    <meta property="og:image" content="https://app.ephe.app/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Ephe — work you can see. A trace that disappears." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ephe — Ephemeral SI Agent" />
    <meta name="twitter:description" content="Give Ephe a task — it researches, builds and delivers. You watch live. Runs locally on the engine you choose." />
    <meta name="twitter:image" content="https://app.ephe.app/og-image.png" />
    <meta name="twitter:image:alt" content="Ephe — work you can see. A trace that disappears." />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ephe" />
    <title>Ephe — Ephemeral SI Agent</title>

    <!-- Fonts are self-hosted (offline-first): @fontsource imports in main.tsx -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
