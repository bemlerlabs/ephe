[[set]]
identifier = "workbench"
description = "Commands the workbench webview may call. The three surface commands are listed first."
permissions = [
  "allow-plugin-window-open",
  "allow-plugin-window-close",
  "allow-plugin-window-bounds",
  "allow-quit-app",
  "allow-stop-backend",
  "allow-backend-parity",
  "allow-backend-readiness",
  "allow-write-rich-clipboard",
  "allow-reveal-file-in-finder",
  "allow-open-file-in-default-app",
  "allow-quick-look-file",
  "allow-extract-image-text",
  "allow-set-dock-badge",
  "allow-set-dock-progress",
  "allow-pick-attachment",
  "allow-pick-folder",
  "allow-set-keep-awake",
  "allow-save-engine-key",
  "allow-engine-key-state",
  "allow-clear-engine-key",
  "allow-minimize-window",
  "allow-maximize-window",
  "allow-close-window",
  "allow-show-window",
  "allow-hide-window",
  "allow-browser-open",
  "allow-browser-bounds",
  "allow-browser-visible",
  "allow-browser-history",
