<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Motion Studio</title>
<style>
body{margin:0;background:#101820;color:#F5F7FA;font:14px system-ui}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid #26333d}
#stage{flex:1;display:grid;place-items:center;min-height:420px}
canvas{background:#0B1117;max-width:100%}
footer{padding:12px 18px;border-top:1px solid #26333d;color:#9FB0BB}
button{background:#1F4D43;color:white;border:0;border-radius:6px;padding:8px 14px;cursor:pointer}
</style></head>
<body>
<header><strong>Motion Studio</strong><button id="refresh">Refresh</button></header>
<div id="stage"><canvas id="preview" width="960" height="540"></canvas></div>
<footer id="status">No project open.</footer>
<script src="ephe.js"></script>
<script>
const status = document.getElementById('status');
const canvas = document.getElementById('preview');
document.getElementById('refresh').addEventListener('click', async () => {
  try {
    const answer = await ephe.callTool('ephe_motion_inspect_project', {});
    status.textContent = answer;
  } catch (error) { status.textContent = String(error); }
});
</script>
</body></html>
