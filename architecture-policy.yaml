# Ephe architecture policy.
# Consumer: scripts/architecture_check.mjs (parser for this regular subset), run by ci-gates.yml.
# What binds: only forbidCycles can stop a push. The four count rules were unbudgeted by the
# owner on 2026-11-05 and report hints however many findings they hold; the checker names the
# live set in escalatingRules, tests/test_r46_architecture_check.py pins it, and
# docs/AI_CONTRIBUTION_POLICY.md states it for contributors. managed feeds that report's
# managedModules count and nothing else, so no step switches these budgets over from here — a
# budget that should bind becomes a rule in the checker, where the counts are compared.
version: 1
global:
  maxFileLines: 400
  maxContractLines: 300
  maxPublicMethods: 12
  forbidCycles: true
  forbidDeepImports: true
  managedOnly: true
modules:
  - id: app-frontend
    roots:
      - "app/src/components"
      - "app/src/hooks"
      - "app/src/lib"
      - "app/src/store"
      - "app/src/pages"
    requires: []
    publicEntrypoints:
      - "app/src/components/index.ts"
      - "app/src/hooks/index.ts"
      - "app/src/lib/index.ts"
      - "app/src/store/index.ts"
      - "app/src/pages/index.ts"
    owner: frontend
    managed: false
  - id: core
    roots:
      - "core"
    requires: []
    publicEntrypoints:
      - "core/__init__.py"
    owner: core
    managed: false
  - id: server
    roots:
      - "server"
    requires:
      - "core"
    publicEntrypoints:
      - "server/main.py"
    owner: backend
    managed: false
  - id: scripts
    roots:
      - "scripts"
    requires: []
    publicEntrypoints: []
    owner: platform
    managed: false
exceptions: []
