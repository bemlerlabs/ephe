name: Secret scan

# WB-18. A committed credential has to fail a build, and this is the leg that
# makes it: `scripts/secret_scan.py` over the whole tracked tree and over the
# added lines of every commit the change carries. The scanner is the
# repository's own, kept in `scripts/` beside `hygiene_check.py` and
# `attribution_check.py` so one implementation is greppable, testable offline
# and free of the download and the licence a pinned third-party action would
# bring. The rule set, the allowlist and the three exit codes are documented at
# the top of that file.
#
# Two scopes, because they catch different leaks. The whole-tree run judges
# what HEAD ships. The range run judges what the commits added, so a credential
# that was committed and then removed inside the same push is still named: at
# HEAD it is already gone, and only the added lines of history carry it.
#
# A step here fails on either of the scanner's two non-zero codes -- 1 for a
# finding and 2 for a path or a range that could not be read -- so an unscanned
# input refuses the same way a detected key does. Neither step carries
# `continue-on-error`, for the same reason.

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: No committed credential in the tree or the diff
    # Fork pull requests are excluded for the reason written out on the pytest
    # job in tests.yml.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Read-only job: keep the token out of .git/config (zizmor: artipacked).
          persist-credentials: false
          # The range run needs the commits the event names present, not the full
          # history (the pack is large). A push depth is a constant: there is no
          # valid expression for "this push's commit count" (`github.event.len` is
          # not a property, and a reference to it invalidates the whole file), so a
          # bound covers the common push and the step below says when a longer one
          # left the range unheld.
          fetch-depth: 50

      - name: Scan the whole tracked tree
        # Exits 1 naming every path, line and rule it found and never the value;
        # 2 when a tracked path could not be read.
        run: python3 scripts/secret_scan.py --all

      - name: Scan the added lines of this change
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.after }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail

          case "$EVENT_NAME" in
            push) declared="$EVENT_BEFORE..$HEAD_SHA" ;;
            pull_request) declared="$PR_BASE..$PR_HEAD" ;;
            *) declared="HEAD^..HEAD" ;;
          esac

          count="$(git rev-list --count "$declared" 2>/dev/null || true)"
          if [ -z "$count" ] || [ "$count" = 0 ]; then
            echo "secret-scan: range $declared names no commit in this checkout, falling back to HEAD^..HEAD"
            declared="HEAD^..HEAD"
            count="$(git rev-list --count "$declared" 2>/dev/null || true)"
          fi
          if [ -z "$count" ] || [ "$count" = 0 ]; then
            echo "secret-scan: no commit range resolves in this checkout; the whole-tree step above already judged HEAD"
            exit 0
          fi

          echo "secret-scan: judging the added lines of $count commit(s) in $declared"
          python3 scripts/secret_scan.py --range "$declared"
