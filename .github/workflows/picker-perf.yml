name: Picker performance

# The only home of the ModelPicker's 500 ms open+filter ceiling. The parallel unit suite reads no
# wall clock: on v0.1.1 the same assertion read 553.7 ms and 811.2 ms on loaded runners while the
# component was unchanged. This lane runs nightly, alone, with one vitest worker, a warm-up and a
# median; the plain-DOM control marks an overloaded host instead of widening the budget.
#
# It is a separate workflow on purpose: it used to sit inside `Runner timing report`, whose long
# pytest budgets have been red since 2026-10-17, so a green picker reading was hidden behind an
# unrelated red run. The suite wall time is still reported by that workflow; it is no longer gated
# there. See scripts/timing-budgets.json for the measurements and the split.

on:
  schedule:
    # 03:00 UTC, after the 02:30 timing report. One measurement per night, no push path.
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: picker-perf-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  picker-perf:
    name: Model picker wall clock (serial)
    runs-on: ${{ vars.CI_LINUX_RUNNER }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Activate the pnpm this repo pins
        # Before setup-node, whose cache step would shell out to a pnpm that does not exist.
        run: |
          corepack enable
          corepack prepare "$(node -p "require('./app/package.json').packageManager")" --activate
          pnpm --version

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: cd app && pnpm install --frozen-lockfile

      - name: Picker open+filter, one worker and a median
        run: cd app && pnpm run test:perf
