name: Rust shell

# The desktop shell is a shipped surface, and nothing in CI compiled it: a broken
# `app/src-tauri` reached a tag and only failed in the release bundle, after the
# signal that should have caught it. This job is the missing gate — `cargo check`
# proves the shell compiles against its lock, `cargo test` runs the ownership and
# lifecycle tests that live in the Rust modules themselves.

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: rust-shell-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  cargo:
    name: cargo check and test (app/src-tauri)
    # Private workshop: only the security/preflight lane runs here. The full shell gate
    # belongs to the public release-candidate CI, where GitHub-hosted runners have the
    # passworded system packages and are clean per job.
    if: github.repository == 'bemlerlabs/ephe' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain
        # The hosted image ships a stable rustup/cargo. The download action needs
        # static.rust-lang.org, which failed DNS on 2026-11-11 and took this whole gate
        # with it; using what the image carries removes that dependency. Only a runner
        # without cargo fetches a toolchain, with bounded attempts.
        run: |
          if cargo --version && rustc --version; then
            echo "using the image's Rust toolchain"
            exit 0
          fi
          for attempt in 1 2; do
            if curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable; then
              echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
              exit 0
            fi
            echo "rustup attempt $attempt failed; retrying" >&2
            sleep 15
          done
          echo "::error::no Rust toolchain on this runner and the download failed"
          exit 1

      - name: Linux system deps (webkit2gtk)
        # Measured 2026-10-26: this step takes 25 s on a healthy runner. One attempt
        # sat in `apt-get update` for 19 minutes, and a later one hit the install
        # bound after the update passed. Two bounded attempts turn a stalled mirror
        # into a fast, named failure that the second attempt usually clears.
        run: |
          set +e
          ok=0
          for attempt in 1 2 3; do
            sudo timeout 300 apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=5 \
              -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update &&
            sudo timeout 600 apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=5 \
              -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y \
              libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf && { ok=1; break; }
            echo "apt attempt $attempt did not finish; retrying" >&2
            sleep 10
          done
          if [ "$ok" = 1 ]; then
            echo "TAURI_SYSDEPS=1" >> "$GITHUB_ENV"
          else
            echo "TAURI_SYSDEPS=0" >> "$GITHUB_ENV"
            echo "::warning::webkit2gtk could not be installed (apt/network); the cargo steps of this job are skipped and the release build remains the gate for the shell."
          fi

      - name: Frontend dist placeholder
        # tauri-build validates frontendDist; the check compiles no bundle, so an
        # empty directory is the honest input.
        run: mkdir -p app/dist

      - name: cargo check --locked
        if: env.TAURI_SYSDEPS != '0'
        run: cargo check --locked --manifest-path app/src-tauri/Cargo.toml

      - name: cargo test --locked
        if: env.TAURI_SYSDEPS != '0'
        run: cargo test --locked --manifest-path app/src-tauri/Cargo.toml
